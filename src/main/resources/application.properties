spring.application.name=amanda_santos

# ---- Banco de dados: MySQL (padrão) ----
spring.datasource.url=jdbc:mysql://localhost:3306/amanda_santos?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=
spring.profiles.active=dev

