<!doctype html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Nova Categoria - Gestão de Estoque</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">
<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/home}">

            📦 Gestão de Estoque

        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="menuPrincipal">

            <ul class="navbar-nav ms-auto align-items-lg-center">


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/produtos}">

                        Produtos

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/categorias}">

                        Categorias

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/estoque}">

                        Estoque

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/historico-movimentacoes}">

                        Histórico

                    </a>

                </li>


                <li class="nav-item">

                    <span class="nav-link fw-bold">

                        <span th:text="${usuarioLogado.nome}">
                            Usuário
                        </span>

                    </span>

                </li>


                <li class="nav-item">

                    <form th:action="@{/logout}"
                          method="post">

                        <button type="submit"
                                class="nav-link btn btn-link">

                            Sair

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>
<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h1 class="h4 fw-bold mb-4">
                        Nova Categoria
                    </h1>

                    <form th:action="@{/categorias/salvar}"
                          th:object="${categoria}"
                          method="post">

                        <div class="mb-3">

                            <label for="nome"
                                   class="form-label">

                                Nome da categoria

                            </label>

                            <input type="text"
                                   id="nome"
                                   class="form-control"
                                   th:field="*{nome}"
                                   placeholder="Ex: Material de Escritório"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">

                            Cadastrar Categoria

                        </button>

                        <a class="btn btn-secondary"
                           th:href="@{/categorias}">

                            Cancelar

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
