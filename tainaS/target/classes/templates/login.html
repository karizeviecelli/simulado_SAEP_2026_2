<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login - Gestão de Estoque</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            color: #212529;
        }

        .login-container {
            min-height: 100vh;
            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e9ecef;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            background: #0d6efd;
            padding: 32px 25px;
            text-align: center;
            color: white;
        }

        .estoque-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.20);
            font-size: 27px;
        }

        .login-header h1 {
            margin: 0 0 7px;
            font-size: 22px;
            font-weight: 700;
        }

        .login-header p {
            margin: 0;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
        }

        .login-body {
            padding: 32px;
        }

        .login-title {
            font-size: 21px;
            font-weight: 700;
        }

        .login-subtitle {
            margin-top: 5px;
            font-size: 12px;
            color: #6c757d;
        }

        .form-label {
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group-custom {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b95a5;
            z-index: 2;
        }

        .form-control {
            height: 46px;
            padding-left: 40px;
            border-radius: 9px;
            border: 1px solid #dfe3e8;
            background-color: #f8f9fa;
            font-size: 13px;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.10);
        }

        .alert {
            margin-bottom: 20px;
            padding: 11px 13px;
            border: none;
            border-radius: 9px;
            font-size: 12px;
        }

        .btn-entrar {
            height: 46px;
            border: none;
            border-radius: 9px;
            background: #0d6efd;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-entrar:hover {
            background: #0b5ed7;
        }

        .cadastro-area {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #edf0f3;
            text-align: center;
        }

        .cadastro-texto {
            display: block;
            margin-bottom: 11px;
            font-size: 12px;
            color: #6c757d;
        }

        .btn-cadastro {
            width: 100%;
            height: 42px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
        }

        .login-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 10px;
            color: #8b95a5;
        }

        @media (max-width: 576px) {

            .login-container {
                padding: 20px 12px;
            }

            .login-body {
                padding: 26px 21px;
            }

            .login-header {
                padding: 28px 20px;
            }
        }

    </style>

</head>

<body>

<main class="container login-container d-flex justify-content-center align-items-center">

    <div class="col-12 col-sm-8 col-md-6 col-lg-4">

        <div class="login-card">

            <div class="login-header">

                <div class="estoque-icon">
                    📦
                </div>

                <h1>Gestão de Estoque</h1>

                <p>
                    Sistema de gerenciamento de almoxarifado
                </p>

            </div>

            <div class="login-body">

                <div class="text-center mb-4">

                    <div class="login-title">
                        Bem-vindo!
                    </div>

                    <div class="login-subtitle">
                        Entre com seus dados para acessar o sistema
                    </div>

                </div>

                <div class="alert alert-danger"
                     role="alert"
                     th:if="${erro}"
                     th:text="${erro}">
                    E-mail ou senha inválidos.
                </div>

                <form th:action="@{/login}" method="post">

                    <div class="mb-3">

                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <div class="input-group-custom">

                            <span class="input-icon">
                                ✉
                            </span>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="Digite seu e-mail"
                                   autocomplete="email"
                                   required>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label for="senha" class="form-label">
                            Senha
                        </label>

                        <div class="input-group-custom">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input type="password"
                                   class="form-control"
                                   id="senha"
                                   name="senha"
                                   placeholder="Digite sua senha"
                                   autocomplete="current-password"
                                   required>

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-primary btn-entrar w-100">

                        Entrar no sistema

                    </button>

                    <div class="cadastro-area">

                        <span class="cadastro-texto">
                            Ainda não possui uma conta?
                        </span>

                        <a class="btn btn-outline-success btn-cadastro"
                           th:href="@{/cadastro}">

                            Criar uma conta

                        </a>

                    </div>

                </form>

            </div>

        </div>

        <div class="login-footer">

            © 2026 Gestão de Estoque • Sistema de Almoxarifado

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
