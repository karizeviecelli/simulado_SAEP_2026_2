<!doctype html>

<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Novo Produto - Gestão de Estoque</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/home}">

            📦 Gestão de Estoque

        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="menuPrincipal">

            <ul class="navbar-nav ms-auto align-items-lg-center">


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/produtos}">

                        Produtos

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/categorias}">

                        Categorias

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/estoque}">

                        Estoque

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/historico-movimentacoes}">

                        Histórico

                    </a>

                </li>


                <li class="nav-item">

                    <span class="nav-link fw-bold">

                        <span th:text="${usuarioLogado.nome}">
                            Usuário
                        </span>

                    </span>

                </li>


                <li class="nav-item">

                    <form th:action="@{/logout}"
                          method="post">

                        <button type="submit"
                                class="nav-link btn btn-link">

                            Sair

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>
<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h1 class="h4 fw-bold mb-1">
                        Cadastro de Produto
                    </h1>

                    <p class="text-muted mb-4">
                        Informe os dados do produto.
                    </p>


                    <form th:action="@{/produtos/salvar}"
                          th:object="${produto}"
                          method="post">


                        <!-- NOME -->

                        <div class="mb-3">

                            <label for="nome"
                                   class="form-label">

                                Nome do produto

                            </label>

                            <input type="text"
                                   id="nome"
                                   class="form-control"
                                   th:field="*{nome}"
                                   placeholder="Ex: Caneta Azul"
                                   required>

                        </div>


                        <!-- DESCRIÇÃO -->

                        <div class="mb-3">

                            <label for="descricao"
                                   class="form-label">

                                Descrição

                            </label>

                            <textarea id="descricao"
                                      class="form-control"
                                      th:field="*{descricao}"
                                      rows="3"
                                      placeholder="Descrição do produto">
                            </textarea>

                        </div>


                        <!-- PREÇO -->

                        <div class="mb-3">

                            <label for="preco"
                                   class="form-label">

                                Preço

                            </label>

                            <input type="number"
                                   id="preco"
                                   class="form-control"
                                   th:field="*{preco}"
                                   step="0.01"
                                   min="0"
                                   placeholder="0,00"
                                   required>

                        </div>


                        <div class="row">


                            <!-- ESTOQUE ATUAL -->

                            <div class="col-md-6 mb-3">

                                <label for="estoqueAtual"
                                       class="form-label">

                                    Estoque atual

                                </label>

                                <input type="number"
                                       id="estoqueAtual"
                                       class="form-control"
                                       th:field="*{estoqueAtual}"
                                       min="0"
                                       placeholder="0"
                                       required>

                            </div>


                            <!-- ESTOQUE MÍNIMO -->

                            <div class="col-md-6 mb-3">

                                <label for="estoqueMinimo"
                                       class="form-label">

                                    Estoque mínimo

                                </label>

                                <input type="number"
                                       id="estoqueMinimo"
                                       class="form-control"
                                       th:field="*{estoqueMinimo}"
                                       min="0"
                                       placeholder="0"
                                       required>

                            </div>

                        </div>


                        <!-- CATEGORIA -->

                        <div class="mb-4">

                            <label for="idCategoria"
                                   class="form-label">

                                Categoria

                            </label>

                            <select id="idCategoria"
                                    class="form-select"
                                    th:field="*{idCategoria}"
                                    required>

                                <option value="">
                                    Selecione uma categoria
                                </option>

                                <option th:each="categoria : ${categorias}"
                                        th:value="${categoria.id}"
                                        th:text="${categoria.nome}">

                                    Categoria

                                </option>

                            </select>

                        </div>


                        <!-- BOTÕES -->

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">

                                Cadastrar Produto

                            </button>

                            <a class="btn btn-secondary"
                               th:href="@{/produtos}">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
