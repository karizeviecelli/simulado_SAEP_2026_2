<!doctype html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Categorias - Gestão de Estoque</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/home}">

            📦 Gestão de Estoque

        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="menuPrincipal">

            <ul class="navbar-nav ms-auto align-items-lg-center">


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/produtos}">

                        Produtos

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/categorias}">

                        Categorias

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/estoque}">

                        Estoque

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/historico-movimentacoes}">

                        Histórico

                    </a>

                </li>


                <li class="nav-item">

                    <span class="nav-link fw-bold">

                        <span th:text="${usuarioLogado.nome}">
                            Usuário
                        </span>

                    </span>

                </li>


                <li class="nav-item">

                    <form th:action="@{/logout}"
                          method="post">

                        <button type="submit"
                                class="nav-link btn btn-link">

                            Sair

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <div>

            <h1 class="h3 fw-bold">
                Categorias
            </h1>

            <p class="text-muted mb-0">
                Categorias utilizadas nos produtos.
            </p>

        </div>

        <a class="btn btn-primary"
           th:href="@{/categorias/nova}">

            + Nova Categoria

        </a>

    </div>


    <div class="alert alert-success"
         th:if="${mensagem}"
         th:text="${mensagem}">

        Categoria cadastrada com sucesso!

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-light">

                    <tr>

                        <th>ID</th>

                        <th>Nome</th>

                        <th class="text-end">
                            Ações
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="categoria : ${categorias}">

                        <td th:text="${categoria.id}">
                            1
                        </td>

                        <td th:text="${categoria.nome}">
                            Material de Escritório
                        </td>

                        <td class="text-end">

                            <form th:action="@{/categorias/excluir/{id}(id=${categoria.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">

                                    Excluir

                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(categorias)}">

                        <td colspan="3"
                            class="text-center text-muted py-4">

                            Nenhuma categoria cadastrada.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

</body>

</html>
